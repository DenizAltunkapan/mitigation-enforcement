# Unattended install config for Debian 7 i386. Minimal system: no desktop,
# just base + build tools needed for exploitation labs (gcc, gdb, make) plus
# an SSH server so labs can be driven non-interactively.
#
# Root login with a fixed password is fine here: this VM only ever runs on
# QEMU user-mode networking (isolated, NAT'd, no bridging to a real LAN).

d-i debian-installer/locale string en_US
d-i keyboard-configuration/xkb-keymap select de

d-i netcfg/get_hostname string legacy
d-i netcfg/get_domain string localdomain
d-i netcfg/choose_interface select auto

d-i mirror/country string manual
d-i mirror/http/hostname string archive.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/use_mirror boolean true
d-i apt-setup/services-select multiselect
d-i pkgsel/update-policy select none

d-i clock-setup/utc boolean true
d-i time/zone string UTC

d-i passwd/root-login boolean true
d-i passwd/root-password password toor
d-i passwd/root-password-again password toor
d-i passwd/make-user boolean false

d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string build-essential gdb gcc-multilib git curl
d-i pkgsel/upgrade select none

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/sda
grub-pc grub-pc/install_devices multiselect /dev/sda
grub-pc grub-pc/install_devices_empty boolean false

d-i finish-install/reboot_in_progress note
