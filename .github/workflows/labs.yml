name: Lab validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m compileall -q scripts tests
      - name: Install offline disk inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils e2fsprogs gdb
      - name: Validate labs and evidence tooling
        run: ./scripts/validate.sh
      - name: Verify host captures reproduce from their collectors
        run: python3 scripts/verify-reproducible.py
