name: Lab validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install offline disk inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils e2fsprogs
      - name: Validate labs and evidence tooling
        run: ./scripts/validate.sh
